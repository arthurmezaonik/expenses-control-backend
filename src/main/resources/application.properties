spring.application.name=expenses-control

# Render supplies PORT; keep 8080 as the local default.
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expenses_control_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:arthurmartins}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# Initial account (only used when the accounts table is empty)
app.initial-account.first-name=${APP_INITIAL_ACCOUNT_FIRST_NAME:}
app.initial-account.last-name=${APP_INITIAL_ACCOUNT_LAST_NAME:}
app.initial-account.email=${APP_INITIAL_ACCOUNT_EMAIL:}
app.initial-account.password=${APP_INITIAL_ACCOUNT_PASSWORD:}

# Browser origin allowed to call the backend with bearer tokens
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JWT signing configuration (provide a Base64-encoded random secret of at least 32 bytes).
# Generate one with: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=${APP_JWT_ISSUER:expenses-control-api}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:15}
